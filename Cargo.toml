[package]
name = "saferun"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "saferun"
path = "src/main.rs"

[[bin]]
name = "saferun-approval"
path = "src/bin/saferun-approval.rs"

[lib]
path = "src/lib.rs"

[dependencies]
regex = "1"
shlex = "1" # used for shell-splitting rule sources
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
